<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>提拉米蘇冷凍結帳系統 - 精緻甜點版</title>
    <style>
        /* 全域樣式設定：奶油白與溫暖色調 */
        body { 
            font-family: "PingFang TC", "Heiti TC", "Noto Sans CJK TC", sans-serif; 
            padding: 20px; 
            max-width: 520px; 
            margin: auto; 
            line-height: 1.8; 
            background-color: #FAF0E6; /* 奶油白背景 */
            color: #4B3621; /* 深巧克力色文字 */
        }
        
        /* 整體容器：像是一個精緻的禮盒 */
        .container { 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 5px 20px rgba(75,54,33,0.08); /* 淡淡的巧克力色陰影 */
        }
        
        /* 標題：深巧克力色，帶有裝飾線 */
        h2 { 
            color: #7B3F00; 
            text-align: center;
            border-bottom: 2px solid #E6C7C2; /* 櫻花粉色裝飾線 */
            padding-bottom: 12px; 
            font-size: 1.4rem; 
            letter-spacing: 1px;
            margin-top: 30px;
        }
        h2:first-of-type { margin-top: 0; }
        
        /* 欄位標籤 */
        label { 
            font-weight: bold; 
            display: block; 
            margin-top: 18px; 
            color: #4B3621;
        }
        
        /* 輸入框：奶油色背景與圓角 */
        input[type="text"], input[type="tel"] { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            box-sizing: border-box; 
            border: 1px solid #E6C7C2; /* 粉色邊框 */
            border-radius: 8px; 
            background-color: #FFFDFB;
            font-size: 1rem;
            color: #4B3621;
        }
        input[type="text"]:focus, input[type="tel"]:focus {
            outline: none;
            border-color: #965A3E; /* 聚焦時變可可色 */
            box-shadow: 0 0 5px rgba(150,90,62,0.2);
        }
        
        /* 商品購物車區塊 */
        .cart-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 12px 0; 
            padding: 20px; 
            background: #FFFDFB; /* 非常淡的奶油色 */
            border-radius: 10px; 
            border: 1px solid #F1E0D6;
        }
        .cart-item-title strong { font-size: 1.1rem; color: #7B3F00; }
        .cart-item-title small { display: block; color: #965A3E; margin-top: 4px; }
        
        /* 數量輸入框 */
        .cart-item input[type="number"] { 
            width: 70px; 
            padding: 10px; 
            text-align: center; 
            border: 1px solid #E6C7C2; 
            border-radius: 8px; 
            font-size: 1.1rem; 
            background-color: white;
            color: #4B3621;
        }
        
        /* 門市查詢群組 */
        .store-input-group { display: flex; gap: 10px; margin-top: 6px; align-items: stretch; }
        .store-input-group input { margin-top: 0; flex-grow: 1; }
        .store-input-group a { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background-color: #E6C7C2; /* 粉色查詢按鈕 */
            padding: 0 18px; 
            text-decoration: none; 
            color: white; 
            border-radius: 8px; 
            font-size: 0.95rem; 
            white-space: nowrap; 
            transition: 0.3s;
        }
        .store-input-group a:hover { background-color: #D4A5A5; }
        
        /* 金額總計區塊 */
        .summary { 
            margin-top: 25px; 
            border-top: 2px dashed #E6C7C2; 
            padding-top: 20px; 
            background-color: #FFFDFB;
            padding: 20px;
            border-radius: 10px;
        }
        .summary p { margin: 8px 0; display: flex; justify-content: space-between; font-size: 1rem; }
        .summary p span:first-child { color: #965A3E; }
        
        /* 免運提示語 */
        .free-shipping-msg { 
            color: #D9534F; /* 警示紅，保留醒目 */
            font-weight: bold; 
            font-size: 0.95rem; 
            text-align: right;
            margin-top: 5px;
            min-height: 1.5em; /* 保持高度避免晃動 */
        }
        
        /* 總計金額大字 */
        .total-row { 
            font-size: 1.5rem; 
            font-weight: bold; 
            color: #4B3621; 
            margin-top: 15px; 
            border-top: 1px solid #F1E0D6;
            padding-top: 10px;
        }
        .total-row span:last-child { color: #7B3F00; }
        
        /* 結帳按鈕：溫暖的可可色 */
        button { 
            width: 100%; 
            padding: 16px; 
            background-color: #7B3F00; /* 可可色 */
            color: white; 
            border: none; 
            font-size: 1.2rem; 
            font-weight: bold;
            border-radius: 10px; 
            cursor: pointer; 
            margin-top: 25px; 
            transition: 0.3s; 
            letter-spacing: 2px;
            box-shadow: 0 4px 10px rgba(123,63,0,0.2);
        }
        button:hover { background-color: #965A3E; transform: translateY(-2px); }
        button:disabled { background-color: #C0C0C0; cursor: not-allowed; transform: none; box-shadow: none;}
    </style>
</head>
<body>

<div class="container">
    <h2>填寫收件資料</h2>
    <label>收件人姓名</label>
    <input type="text" id="cust_name" placeholder="真實姓名，取件需核對證件">

    <label>聯絡電話</label>
    <input type="tel" id="cust_phone" placeholder="09開頭，共10碼" maxlength="10">

    <label>收件門市 (7-11 冷凍店到店)</label>
    <div class="store-input-group">
        <input type="text" id="shipping_store" placeholder="6碼店號或門市名稱">
        <a href="https://emap.pcsc.com.tw/emap.aspx" target="_blank">🔍 查詢門市</a>
    </div>

    <h2>購物車明細</h2>
    <div id="cart-container">
        <div class="cart-item">
            <div class="cart-item-title">
                <strong>提拉米蘇-無酒精版3盒</strong>
                <small>單組 $600</small>
            </div>
            <input type="number" id="qty_no_alcohol" value="0" min="0" onchange="calculateTotal()">
        </div>
        <div class="cart-item">
            <div class="cart-item-title">
                <strong>提拉米蘇-正常版3盒</strong>
                <small>單組 $600</small>
            </div>
            <input type="number" id="qty_normal" value="0" min="0" onchange="calculateTotal()">
        </div>
    </div>

    <div class="summary">
        <p><span>商品小計</span><span id="subtotal">$0</span></p>
        <p><span>冷凍運費</span><span id="shipping_fee">$129</span></p>
        <div class="free-shipping-msg" id="free_shipping_msg"></div>
        <p class="total-row"><span>總計金額</span><span id="grand_total">$0</span></p>
    </div>

    <button onclick="submitOrder()">確認結帳</button>
</div>

<script>
    // 計算金額與免運邏輯
    function calculateTotal() {
        const price = 600;
        const qtyNoAlcohol = parseInt(document.getElementById('qty_no_alcohol').value) || 0;
        const qtyNormal = parseInt(document.getElementById('qty_normal').value) || 0;
        
        const subtotal = (qtyNoAlcohol + qtyNormal) * price;
        document.getElementById('subtotal').innerText = `$${subtotal}`;

        let shippingFee = 129;
        let msg = '';

        if (subtotal === 0) {
            msg = '';
            shippingFee = 0; 
        } else if (subtotal >= 1500) {
            shippingFee = 0;
            msg = '🎉 已達 $1500 門檻，享免運優惠！';
        } else {
            msg = `再買 $${1500 - subtotal} 即可享冷凍免運。`;
        }

        document.getElementById('shipping_fee').innerText = `$${shippingFee}`;
        document.getElementById('free_shipping_msg').innerText = msg;
        document.getElementById('grand_total').innerText = `$${subtotal + shippingFee}`;
    }

    // 送出訂單邏輯
    function submitOrder() {
        const name = document.getElementById('cust_name').value.trim();
        const phone = document.getElementById('cust_phone').value.trim();
        const store = document.getElementById('shipping_store').value.trim();
        const qtyNoAlcohol = parseInt(document.getElementById('qty_no_alcohol').value) || 0;
        const qtyNormal = parseInt(document.getElementById('qty_normal').value) || 0;

        if (qtyNoAlcohol === 0 && qtyNormal === 0) {
            alert('購物車是空的，請至少選擇一組提拉米蘇再結帳喔。');
            return;
        }
        if (!name || !phone || !store) {
            alert('資料沒填完喔，請確認姓名、電話和門市都有填寫。');
            return;
        }
        if (!phone.startsWith('09') || phone.length !== 10) {
            alert('手機號碼格式不對，必須是 09 開頭的 10 個數字。');
            return;
        }

        const totalAmt = document.getElementById('grand_total').innerText;

        const orderData = {
            name: name,
            phone: phone,
            store: store,
            qty_no_alcohol: qtyNoAlcohol,
            qty_normal: qtyNormal,
            total: totalAmt
        };

        // 按鈕變成處理中
        const btn = document.querySelector('button');
        btn.innerText = "訂單連線傳送中...";
        btn.disabled = true;

        // ★★★ 把下面引號裡的字，換成妳的 Google Apps Script 網址 ★★★
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwYbCgkVtzYzbSddv-9zHPX8zx6_SqAZx9Z10dkaPkGpWAEWfCxU3ALBIYKgmT9WPQL5A/exec';

        fetch(scriptURL, {
            method: 'POST',
            body: JSON.stringify(orderData),
            headers: { 'Content-Type': 'text/plain;charset=utf-8' }
        })
        .then(response => {
            alert(`訂單送出成功！\n\n我們將盡快為您安排出貨。`);
            window.location.reload(); 
        })
        .catch(error => {
            alert('網路卡住了，請稍後再試一次。');
            btn.innerText = "確認結帳";
            btn.disabled = false;
        });
    }

    window.onload = calculateTotal;
</script>

</body>
</html>
